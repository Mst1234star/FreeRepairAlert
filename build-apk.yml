name: Build FreeRepairAlert APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p "$(dirname 'settings.gradle.kts')"
          echo '' | base64 -d > 'settings.gradle.kts'
          mkdir -p "$(dirname 'build.gradle.kts')"
          echo 'cGx1Z2lucyB7CiAgICBpZCgiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iKSB2ZXJzaW9uICI4LjcuMyIgYXBwbHkgZmFsc2UKICAgIGlkKCJvcmcuamV0YnJhaW5zLmtvdGxpbi5hbmRyb2lkIikgdmVyc2lvbiAiMi4wLjIxIiBhcHBseSBmYWxzZQp9Cg==' | base64 -d > 'build.gradle.kts'
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          echo '' | base64 -d > 'app/build.gradle.kts'
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          echo '' | base64 -d > 'app/src/main/AndroidManifest.xml'
          mkdir -p "$(dirname 'app/src/main/java/ie/adverts/freealert/MainActivity.kt')"
          echo '' | base64 -d > 'app/src/main/java/ie/adverts/freealert/MainActivity.kt'
          mkdir -p "$(dirname 'app/src/main/java/ie/adverts/freealert/AdvertsWorker.kt')"
          echo '' | base64 -d > 'app/src/main/java/ie/adverts/freealert/AdvertsWorker.kt'
          mkdir -p "$(dirname 'app/src/main/assets/filters.txt')"
          echo 'IyBPbmUga2V5d29yZCBwZXIgbGluZS4gTGVhdmUgZW1wdHkgdG8gYWxsb3cgYWxsIG1hdGNoaW5nIGxpc3RpbmdzLgojIEV4YW1wbGVzOgojIGdvbGYKIyB2b2xrc3dhZ2VuCiMgYXVkaQojIGJtdwojIGVuZ2luZQojIGdlYXJib3gKIyBwYXJ0cwojIHJlcGFpcgo=' | base64 -d > 'app/src/main/assets/filters.txt'
          mkdir -p "$(dirname 'app/src/main/res/values/themes.xml')"
          echo 'PHJlc291cmNlcz48c3R5bGUgbmFtZT0iVGhlbWUuQWR2ZXJ0c0ZyZWVBbGVydCIgcGFyZW50PSJhbmRyb2lkOnN0eWxlL1RoZW1lLk1hdGVyaWFsLkxpZ2h0Lk5vQWN0aW9uQmFyIi8+PC9yZXNvdXJjZXM+' | base64 -d > 'app/src/main/res/values/themes.xml'
          mkdir -p "$(dirname 'app/src/main/res/values/strings.xml')"
          echo 'PHJlc291cmNlcz48c3RyaW5nIG5hbWU9ImFwcF9uYW1lIj5BZHZlcnRzIEZyZWUgQWxlcnQ8L3N0cmluZz48L3Jlc291cmNlcz4=' | base64 -d > 'app/src/main/res/values/strings.xml'


      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeRepairAlert-debug
          path: app/build/outputs/apk/debug/*.apk
